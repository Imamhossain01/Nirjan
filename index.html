<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nirjan — a still point for a loud day</title>

<!-- Typefaces -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Soft ambient light sources & Water Ripple Canvas -->
  <div class="field">
    <div class="glow glow-emerald"></div>
    <div class="glow glow-gold"></div>
    <canvas id="waterCanvas"></canvas>
  </div>

  <main class="panel landscape-panel">

    <!-- LEFT SIDE: Brand & Master Control -->
    <div class="panel-left">
      <header class="brand">
        <h1 class="wordmark">Nirjan</h1>
        <p class="tagline">A still point for a loud day</p>
      </header>

      <section class="master" aria-label="Master control">
        <button class="master-dial" id="masterDial" aria-pressed="false" aria-label="Play all sounds">
          <span class="master-ring ring-1"></span>
          <span class="master-ring ring-2"></span>
          <svg id="masterIcon" class="master-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path id="masterIconPath" d="M8 5.5V18.5L19 12L8 5.5Z" fill="currentColor"/>
          </svg>
        </button>
        <p class="master-label" id="masterLabel">Press to begin</p>
      </section>

      <footer class="foot">
        <p>Immersive ambient soundscapes generated live in your browser.</p>
      </footer>
    </div>

    <!-- RIGHT SIDE: Sound Channels Grid -->
    <section class="grid landscape-grid" aria-label="Ambient sound channels">

      <!-- RAIN -->
      <article class="card" data-sound="rain">
        <div class="card-halo"></div>
        <div class="card-row">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6.5 13.5C4.6 13.5 3 11.9 3 10C3 8.24 4.36 6.8 6.1 6.61C6.63 4.53 8.51 3 10.75 3C13.13 3 15.1 4.74 15.45 7C17.46 7.2 19 8.9 19 11C19 12.1 18.55 13.09 17.82 13.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M8 17L7 19.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M12 17L11 19.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M16 17L15 19.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </span>
          <span class="titles">
            <span class="name">Rainfall</span>
            <span class="bn">ঝিরিঝিরি বৃষ্টি</span>
          </span>
          <button class="toggle" data-toggle="rain" aria-pressed="false"><span class="toggle-dot"></span></button>
        </div>
        <canvas class="wave" data-wave="rain" width="220" height="28"></canvas>
        <div class="slider-row">
          <input type="range" class="slider" data-slider="rain" min="0" max="100" value="55">
        </div>
      </article>

      <!-- THUNDER -->
      <article class="card" data-sound="thunder">
        <div class="card-halo"></div>
        <div class="card-row">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="titles">
            <span class="name">Thunder</span>
            <span class="bn">বজ্রপাত</span>
          </span>
          <button class="toggle" data-toggle="thunder" aria-pressed="false"><span class="toggle-dot"></span></button>
        </div>
        <canvas class="wave" data-wave="thunder" width="220" height="28"></canvas>
        <div class="slider-row">
          <input type="range" class="slider" data-slider="thunder" min="0" max="100" value="50">
        </div>
      </article>

      <!-- FOREST -->
      <article class="card" data-sound="forest">
        <div class="card-halo"></div>
        <div class="card-row">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3L16.5 10.5H13.7L17.5 16H6.5L10.3 10.5H7.5L12 3Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M12 16V21" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </span>
          <span class="titles">
            <span class="name">Forest & Fauna</span>
            <span class="bn">বন ও বন্যপ্রাণী</span>
          </span>
          <button class="toggle" data-toggle="forest" aria-pressed="false"><span class="toggle-dot"></span></button>
        </div>
        <canvas class="wave" data-wave="forest" width="220" height="28"></canvas>
        <div class="slider-row">
          <input type="range" class="slider" data-slider="forest" min="0" max="100" value="50">
        </div>
      </article>

      <!-- WIND -->
      <article class="card" data-sound="wind">
        <div class="card-halo"></div>
        <div class="card-row">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M9.5 5.5C9.5 4.39 10.39 3.5 11.5 3.5C12.61 3.5 13.5 4.39 13.5 5.5V18.5C13.5 19.61 12.61 20.5 11.5 20.5C10.39 20.5 9.5 19.61 9.5 18.5V5.5Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M5 9H14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3 14H12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </span>
          <span class="titles">
            <span class="name">Gentle Wind</span>
            <span class="bn">খোলা বাতাস</span>
          </span>
          <button class="toggle" data-toggle="wind" aria-pressed="false"><span class="toggle-dot"></span></button>
        </div>
        <canvas class="wave" data-wave="wind" width="220" height="28"></canvas>
        <div class="slider-row">
          <input type="range" class="slider" data-slider="wind" min="0" max="100" value="45">
        </div>
      </article>

      <!-- BEACH -->
      <article class="card" data-sound="beach">
        <div class="card-halo"></div>
        <div class="card-row">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M3 16C5 16 6 14 8 14C10 14 11 16 13 16C15 16 16 14 18 14C20 14 21 16 23 16" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3 12C5 12 6 10 8 10C10 10 11 12 13 12C15 12 16 10 18 10C20 10 21 12 23 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </span>
          <span class="titles">
            <span class="name">Ocean Beach</span>
            <span class="bn">সমুদ্রের ঢেউ</span>
          </span>
          <button class="toggle" data-toggle="beach" aria-pressed="false"><span class="toggle-dot"></span></button>
        </div>
        <canvas class="wave" data-wave="beach" width="220" height="28"></canvas>
        <div class="slider-row">
          <input type="range" class="slider" data-slider="beach" min="0" max="100" value="50">
        </div>
      </article>

      <!-- NIGHT CRICKETS -->
      <article class="card" data-sound="crickets">
        <div class="card-halo"></div>
        <div class="card-row">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M15.5 4.5C12 4.5 9 7.46 9 11C9 14.54 12 17.5 15.5 17.5C16.4 17.5 17.25 17.32 18 17C16.24 18.8 13.78 20 11 20C6.03 20 2 15.97 2 11C2 6.03 6.03 2 11 2C13.32 2 15.4 2.9 17 4.34C16.5 4.45 16 4.5 15.5 4.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M20 8L20.6 9.4L22 10L20.6 10.6L20 12L19.4 10.6L18 10L19.4 9.4L20 8Z" fill="currentColor"/></svg>
          </span>
          <span class="titles">
            <span class="name">Night Crickets</span>
            <span class="bn">নিঝুম রাত</span>
          </span>
          <button class="toggle" data-toggle="crickets" aria-pressed="false"><span class="toggle-dot"></span></button>
        </div>
        <canvas class="wave" data-wave="crickets" width="220" height="28"></canvas>
        <div class="slider-row">
          <input type="range" class="slider" data-slider="crickets" min="0" max="100" value="45">
        </div>
      </article>

    </section>

  </main>

<script src="script.js"></script>
</body>
</html>
